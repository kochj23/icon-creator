# GitHub Actions Workflow for A/B Testing Icon Variants
# Generates multiple icon variants for testing
# Author: Jordan Koch

name: Generate Icon Variants for A/B Testing

on:
  workflow_dispatch:
    inputs:
      variant_count:
        description: 'Number of variants to generate'
        required: false
        default: '5'
      styles:
        description: 'Styles to apply (comma-separated)'
        required: false
        default: 'original,gradient,shadow,rounded,vibrant'
      firebase_upload:
        description: 'Upload to Firebase Remote Config'
        required: false
        default: 'false'

jobs:
  generate-variants:
    name: Generate Icon Variants
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Icon Creator CLI
        run: |
          curl -L https://github.com/kochj23/icon-creator/releases/latest/download/icon-creator-cli -o /usr/local/bin/icon-creator
          chmod +x /usr/local/bin/icon-creator

      - name: Generate Variants
        run: |
          icon-creator variants \
            --input assets/icon-source.png \
            --output ./variants \
            --count ${{ github.event.inputs.variant_count }} \
            --styles ${{ github.event.inputs.styles }} \
            --verbose

      - name: Generate Variant Metadata
        id: metadata
        run: |
          # Create variant catalog with tracking IDs
          python3 << 'PYTHON'
          import json
          import os
          from datetime import datetime

          variants = []
          for variant_dir in os.listdir('./variants'):
              if variant_dir.startswith('variant_'):
                  metadata_file = f'./variants/{variant_dir}/metadata.json'
                  if os.path.exists(metadata_file):
                      with open(metadata_file, 'r') as f:
                          data = json.load(f)
                          variants.append(data)

          catalog = {
              'generated_at': datetime.utcnow().isoformat(),
              'commit_sha': os.getenv('GITHUB_SHA'),
              'total_variants': len(variants),
              'variants': variants
          }

          with open('variant-catalog.json', 'w') as f:
              json.dump(catalog, f, indent=2)

          print(f"Generated {len(variants)} variants")
          PYTHON

      - name: Upload to Firebase Remote Config
        if: ${{ github.event.inputs.firebase_upload == 'true' }}
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          # Install Firebase CLI
          npm install -g firebase-tools

          # Authenticate with service account
          echo "$FIREBASE_SERVICE_ACCOUNT" > service-account.json
          export GOOGLE_APPLICATION_CREDENTIALS="service-account.json"

          # Upload variant metadata to Remote Config
          firebase deploy --only remoteconfig --project ${{ secrets.FIREBASE_PROJECT_ID }}

          echo "✅ Variants uploaded to Firebase Remote Config"

      - name: Create Variant Gallery
        run: |
          # Generate HTML gallery for easy preview
          python3 << 'PYTHON'
          import json
          import os

          html = '''
          <!DOCTYPE html>
          <html>
          <head>
              <title>Icon Variants Gallery</title>
              <style>
                  body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 40px; background: #f5f5f5; }
                  h1 { text-align: center; }
                  .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
                  .variant { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
                  .variant img { width: 100%; border-radius: 8px; }
                  .variant h3 { margin: 10px 0 5px 0; }
                  .variant p { color: #666; font-size: 14px; }
                  .tracking-id { font-family: monospace; background: #f0f0f0; padding: 4px 8px; border-radius: 4px; }
              </style>
          </head>
          <body>
              <h1>🎨 Icon Variants for A/B Testing</h1>
              <div class="gallery">
          '''

          with open('variant-catalog.json', 'r') as f:
              catalog = json.load(f)

          for variant in catalog['variants']:
              variant_id = variant['id']
              style = variant['style']
              html += f'''
              <div class="variant">
                  <img src="../variants/{variant_id}/icon.png" alt="{variant_id}">
                  <h3>{style.title()}</h3>
                  <p>Tracking ID: <span class="tracking-id">{variant_id}</span></p>
              </div>
              '''

          html += '''
              </div>
          </body>
          </html>
          '''

          with open('variants/gallery.html', 'w') as f:
              f.write(html)

          print("✅ Gallery created at variants/gallery.html")
          PYTHON

      - name: Upload Variants
        uses: actions/upload-artifact@v4
        with:
          name: icon-variants
          path: |
            variants/
            variant-catalog.json

      - name: Create Issue with Variant Links
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const catalog = JSON.parse(fs.readFileSync('variant-catalog.json', 'utf8'));

            let body = `## 🎨 Icon Variants Generated for A/B Testing\n\n`;
            body += `**Total Variants:** ${catalog.total_variants}\n`;
            body += `**Commit:** ${catalog.commit_sha}\n\n`;
            body += `### 📊 Variants\n\n`;

            catalog.variants.forEach((v, i) => {
              body += `${i + 1}. **${v.style}** - Tracking ID: \`${v.id}\`\n`;
            });

            body += `\n### 📦 Downloads\n`;
            body += `Download the variants from the [workflow artifacts](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})\n\n`;
            body += `### 🔗 Gallery\n`;
            body += `View the [variant gallery](https://github.com/${{ github.repository }}/blob/${{ github.sha }}/variants/gallery.html)\n`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `🎨 Icon Variants Generated - ${new Date().toLocaleDateString()}`,
              body: body,
              labels: ['icons', 'ab-testing']
            });
